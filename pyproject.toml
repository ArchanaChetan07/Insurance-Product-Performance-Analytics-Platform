[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-pipeline"
version = "1.0.0"
description = "Medallion ELT for synthetic NTA/MTC insurance claims"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1,<2.3",
  "numpy>=1.26,<2.1",
  "openpyxl>=3.1",
  "pyarrow>=14.0",
  "streamlit>=1.28",
  "scikit-learn>=1.3,<1.6",
]

[project.scripts]
insurance-pipeline = "insurance_pipeline.run:main"

[tool.setuptools.packages.find]
include = ["insurance_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
